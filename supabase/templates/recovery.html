<h2>Reset your password</h2>
<p>
	Follow this link to set a new password for Boreal Search. It works once and expires in an hour:
</p>
<!-- RedirectTo is our /auth/confirm?next=… URL (SiteURL when none was allowed). One printf
     action, because html/template rejects {{ .TokenHash }} after a URL of unknown shape. -->
{{ if eq .RedirectTo .SiteURL }}
<p>
	<a
		href="{{ .SiteURL }}/auth/confirm?next=/account/password&token_hash={{ .TokenHash }}&type=recovery"
		>Set a new password</a
	>
</p>
{{ else }}
<p>
	<a href="{{ printf `%s&token_hash=%s&type=recovery` .RedirectTo .TokenHash }}"
		>Set a new password</a
	>
</p>
{{ end }}
<p>If you didn't ask to reset your password, you can ignore this email.</p>
